version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mydb2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1252
    ports:
      - "5432:5432"
    # volumes:
    #   - pgdata:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    ports:
    - "6379:6379"

  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1252
      DB_DATABASE: mydb2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

# volumes:
#   pgdata:

